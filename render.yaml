# Render blueprint for the FULL app (live document-to-video generation).
# Builds the all-in-one Docker image (frontend + FastAPI pipeline) and serves
# everything from one URL. The Vercel deploy (instant static demo) is separate
# and unaffected.
#
# Plan note: this is set to the FREE tier so deploying requires no payment info.
# Caveats of free: 512 MB RAM (can OOM on larger uploads during ffmpeg +
# embedding), the service sleeps after ~15 min idle (30-60s cold start), and
# there's no persistent disk (the seed library reloads on every boot; user-
# generated nuggets are cleared on restart).
#
# To make live generation reliable later, upgrade in the Render dashboard (or
# set `plan: standard` here) and optionally re-add a `disk:` block for
# persistence — both require a card on file.
services:
  - type: web
    name: video-nuggets-os
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Open generation so hiring teams can upload + generate without a login.
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      # Optional free Groq Llama-3 key — sharpens the "simplify" text and chat.
      # Generation works fully without it (deterministic). Add later in the UI.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: EDGE_TTS_VOICE
        value: en-US-AndrewNeural
